<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HERD Explorer: Compare</title>
  <meta name="description" content="Compare institutions' research and development spending over time using NCSES HERD Survey data." />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/site.css" />
  <style>
    .controls fieldset { border: none; margin: 0; padding: 0; min-width: 0; }
    .controls fieldset legend { font-size: 0.8rem; font-weight: 600; color: var(--muted); padding: 0; margin-bottom: 0.25rem; }
    .controls .radios { display: flex; flex-wrap: wrap; gap: 0.2rem 0.9rem; font-size: 0.9rem; padding: 0.3rem 0; }
    .controls .radios label { flex-direction: row; align-items: center; gap: 0.3rem; font-size: 0.9rem; font-weight: 400; color: var(--ink); }
    .controls .radios input { min-width: 0; width: auto; margin: 0; }
    .controls .radios select { min-width: 0; font-size: 0.85rem; padding: 0.15rem 0.3rem; }
    .controls .radios select[hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>Compare institutions</h1>
    <p class="lede">Add institutions to see their trends side by side. The dashed lines show the median institution in
      each one's group, for context.</p>

    <div class="controls">
      <label>Add an institution
        <input id="search" list="inst-list" placeholder="Start typing a name" autocomplete="off" />
        <datalist id="inst-list"></datalist>
      </label>
      <label>Measure <select id="measure"></select></label>
      <fieldset id="mode">
        <legend>Show as</legend>
        <div class="radios">
          <label><input type="radio" name="mode" value="value" checked /> Amount</label>
          <label><input type="radio" name="mode" value="faculty" /> Per faculty member</label>
          <select id="per" aria-label="Which faculty count" hidden>
            <option value="ft">Full-time instructional staff</option>
            <option value="tenure">Tenured and tenure-track faculty</option>
            <option value="research">Full-time instructional and research staff</option>
          </select>
          <label><input type="radio" name="mode" value="index" /> Index (FY <span data-meta="first_year">2012</span> = 100)</label>
        </div>
      </fieldset>
      <label>Context
        <select id="context">
          <option value="sector">Median of each institution's type</option>
          <option value="none">None</option>
        </select>
      </label>
      <label class="inline"><span><input type="checkbox" id="project" /> Show projection to FY <span data-meta="projection_last_year">2029</span></span></label>
      <span id="proj-flag" class="proj-flag" role="status" hidden></span>
    </div>
    <div id="chips" class="chips"></div>

    <div id="chart" class="chart"><p class="status">Loading the database in your browser&hellip;</p></div>
    <p id="proj-note" class="chart-note projection-note" hidden></p>
    <p id="note" class="chart-note"></p>
  </main>

  <script type="module">
    import { renderLayout } from './js/layout.js';
    import { meta } from './js/meta.js';
    import { query, lit } from './js/db.js';
    import { plotly, PALETTE, BASE_LAYOUT, CONFIG, short, unitAxis } from './js/charts.js';
    import { fillMeasureSelect, measure } from './js/measures.js';
    import { updateToggle, institutionBands, bandTraces, DISCLAIMER_SHORT } from './js/projections.js';

    renderLayout('compare.html');
    const M = await meta;
    const $ = id => document.getElementById(id);

    const insts = await query(`SELECT inst_id, name, state, sector FROM institution_latest ORDER BY name`);
    const byLabel = new Map(insts.map(i => [`${i.name} (${i.state})`, i]));
    $('inst-list').innerHTML = [...byLabel.keys()].map(l => `<option value="${l.replaceAll('"', '&quot;')}"></option>`).join('');

    // Start from the URL (?inst=id,id) or a few examples
    const params = new URLSearchParams(location.search);
    let selected = (params.get('inst')?.split(',') ?? [])
      .filter(id => insts.some(i => i.inst_id === id));
    if (!selected.length) {
      selected = insts.filter(i => /^University of Idaho$|^Boise State University$|^Idaho State University$/.test(i.name)).map(i => i.inst_id);
    }

    await fillMeasureSelect($('measure'), params.get('measure') ?? 'source_all_r_d');

    // Show as: amount, amount per full-time faculty member, or an index
    const getMode = () => document.querySelector('input[name="mode"]:checked').value;
    const startMode = params.get('mode');
    if (['faculty', 'index'].includes(startMode)) document.querySelector(`input[name="mode"][value="${startMode}"]`).checked = true;
    // Which IPEDS count to divide by (all from context_ipeds, not HERD data)
    const STAFF = {
      ft: { sql: 'c.ft_instructional_staff', one: 'full-time faculty member', count: 'full-time faculty',
            note: 'IPEDS full-time instructional staff (NCES). Instructional staff include faculty who do no research, so this is per faculty member, not per researcher.' },
      tenure: { sql: 'c.tenure_line_faculty', one: 'tenure-line faculty member', count: 'tenure-line faculty',
                note: 'IPEDS full-time instructional staff who are tenured or on the tenure track (NCES). Institutions without a tenure system have none, so they show no value.' },
      research: { sql: '(c.ft_instructional_staff + coalesce(c.ft_research_staff, 0))', one: 'faculty or research staff member',
                  count: 'faculty and research staff',
                  note: 'IPEDS full-time instructional staff plus full-time staff whose main job is research, such as research scientists and postdocs on the payroll (NCES).' },
    };
    if (STAFF[params.get('per')]) $('per').value = params.get('per');
    const showPer = () => { $('per').hidden = getMode() !== 'faculty'; };
    showPer();

    function renderChips() {
      $('chips').innerHTML = selected.map((id, k) => {
        const i = insts.find(x => x.inst_id === id);
        return `<span class="chip" style="border-color:${PALETTE[k % PALETTE.length]}">${i.name}
          <button aria-label="Remove ${i.name}" data-id="${id}">&times;</button></span>`;
      }).join('');
      $('chips').querySelectorAll('button').forEach(b => b.onclick = () => {
        selected = selected.filter(id => id !== b.dataset.id); update();
      });
    }

    async function draw() {
      const id = $('measure').value, mode = getMode(), context = $('context').value, staff = STAFF[$('per').value];
      const m = await measure(id);
      const Plotly = await plotly();
      if (!selected.length) { $('chart').innerHTML = '<p class="status">Add an institution to begin.</p>'; return; }

      // Faculty: an IPEDS staff count (not HERD data), counted the November before each fiscal year
      const rows = await query(`
        SELECT m.inst_id, m.year, m.value, ${staff.sql} AS faculty
        FROM metrics m LEFT JOIN context_ipeds c USING (inst_id, year)
        WHERE m.measure_id = ${lit(id)} AND m.inst_id IN (${selected.map(lit).join(',')}) ORDER BY m.year`);
      const perFaculty = p => p.faculty > 0 ? p.value / p.faculty : null;
      const series = (pts) => {
        const base = pts[0]?.value;
        return pts.map(p => mode === 'index' ? (base ? 100 * p.value / base : null)
          : mode === 'faculty' ? perFaculty(p) : p.value);
      };
      // Per-faculty amounts: dollars as usual; people per faculty member need decimals
      const shortPer = v => v == null ? '' : m.unit === 'dollars' ? short(v, 'dollars') : v.toFixed(2);
      const hoverText = p => mode !== 'faculty' ? short(p.value, m.unit)
        : p.faculty > 0 ? `${shortPer(perFaculty(p))} per ${staff.one} (${short(p.value, m.unit)}, ${Math.round(p.faculty).toLocaleString()} ${staff.count})`
        : `No IPEDS count of ${staff.count}`;

      const traces = selected.map((sid, k) => {
        const inst = insts.find(i => i.inst_id === sid);
        const pts = rows.filter(r => r.inst_id === sid);
        return { x: pts.map(p => p.year), y: series(pts), text: pts.map(hoverText), name: inst.name,
                 type: 'scatter', mode: 'lines+markers', line: { color: PALETTE[k % PALETTE.length], width: 2.5 },
                 marker: { size: 7 }, hovertemplate: mode === 'index' ? '%{y:.0f} (%{text})' : '%{text}' };
      });

      const canProject = await updateToggle($('project'), $('proj-flag'), id,
        mode === 'faculty' ? 'projections are of amounts, not amounts per faculty member.' : null);
      if ($('project').checked && canProject) {
        let bands = [];
        try { bands = await institutionBands(id, selected); }
        catch (e) { $('proj-flag').hidden = false; $('proj-flag').textContent = `⚠ ${e.message}`; }
        selected.forEach((sid, k) => {
          const pts = rows.filter(r => r.inst_id === sid);
          const b = bands.filter(x => x.grp === sid);
          if (!pts.length || !b.length) return;
          const base = pts[0].value;
          const scaleP = v => mode === 'index' ? 100 * v / base : v;
          traces.push(...bandTraces(b, pts[pts.length - 1], PALETTE[k % PALETTE.length], scaleP, insts.find(i => i.inst_id === sid).name,
            mode === 'index' ? v => v.toFixed(0) : v => short(v, m.unit)));
        });
      }
      $('proj-note').hidden = !($('project').checked && canProject);
      $('proj-note').innerHTML = `${DISCLAIMER_SHORT} Shaded bands show the 80% and 90% ranges. <a href="model.html">How projections are made</a>.`;

      if (context === 'sector') {
        const sectors = [...new Set(selected.map(sid => insts.find(i => i.inst_id === sid).sector))];
        // Per faculty member, the median is of each institution's own ratio, among institutions with a faculty count
        const med = await query(mode === 'faculty' ? `
          SELECT i.sector, m.year, median(m.value / ${staff.sql}) AS value, count(*) AS n
          FROM metrics m JOIN institution_latest i USING (inst_id) JOIN context_ipeds c USING (inst_id, year)
          WHERE m.measure_id = ${lit(id)} AND i.sector IN (${sectors.map(lit).join(',')}) AND ${staff.sql} > 0
          GROUP BY ALL ORDER BY m.year` : `
          SELECT i.sector, m.year, median(m.value) AS value, count(*) AS n
          FROM metrics m JOIN institution_latest i USING (inst_id)
          WHERE m.measure_id = ${lit(id)} AND i.sector IN (${sectors.map(lit).join(',')})
          GROUP BY ALL ORDER BY m.year`);
        for (const s of sectors) {
          const pts = med.filter(r => r.sector === s);
          // The median rows already hold per-faculty values, so they are plotted as they are
          const y = mode === 'faculty' ? pts.map(p => p.value) : series(pts);
          const amount = v => mode === 'faculty' ? `${shortPer(v)} per ${staff.one}` : short(v, m.unit);
          traces.push({ x: pts.map(p => p.year), y, text: pts.map(p => `${amount(p.value)}, median of ${p.n}`),
                        name: `Median: ${s}`, type: 'scatter', mode: 'lines', line: { color: '#777', width: 1.5, dash: 'dash' },
                        hovertemplate: mode === 'index' ? '%{y:.0f} (%{text})' : '%{text}' });
        }
      }

      if (!$('chart').data) $('chart').innerHTML = '';
      Plotly.react('chart', traces, {
        ...BASE_LAYOUT,
        yaxis: { ...BASE_LAYOUT.yaxis,
                 title: { text: mode === 'index' ? `Index, FY ${M.first_year} = 100`
                   : mode === 'faculty' ? `${unitAxis(m.unit)} per ${staff.one}` : unitAxis(m.unit) },
                 tickprefix: mode !== 'index' && m.unit === 'dollars' ? '$' : '', rangemode: mode === 'index' ? 'normal' : 'tozero' },
      }, CONFIG);
      $('note').textContent = `${m.label}: ${m.definition} Covers ${m.coverage.toLowerCase()}. ` +
        `Source: NCSES HERD Survey public microdata, FY ${M.first_year}-${M.last_year}. Nominal dollars. Institution type from the 2021 Carnegie Classification.` +
        (mode === 'faculty' ? ` Divided by ${staff.note} Not HERD data. Counted the November before each fiscal year;` +
          ` no count for FY ${M.first_year}, and none where HERD and IPEDS do not report the same campus.` : '');
    }

    function update() {
      const u = new URL(location);
      u.searchParams.set('inst', selected.join(','));
      u.searchParams.set('measure', $('measure').value);
      if (getMode() === 'value') u.searchParams.delete('mode'); else u.searchParams.set('mode', getMode());
      if (getMode() === 'faculty' && $('per').value !== 'ft') u.searchParams.set('per', $('per').value); else u.searchParams.delete('per');
      showPer();
      history.replaceState(null, '', u);
      renderChips();
      draw();
    }

    $('search').addEventListener('change', () => {
      const inst = byLabel.get($('search').value);
      if (inst && !selected.includes(inst.inst_id)) { selected.push(inst.inst_id); update(); }
      $('search').value = '';
    });
    for (const id of ['measure', 'mode', 'context', 'project']) $(id).addEventListener('change', update);
    update();
  </script>
</body>
</html>
